name: CI/CD – Deploy to Azure App Service

on:
  push:
    branches:
      - main          # Despliega en cada push a main
  workflow_dispatch:  # Permite disparar manualmente desde GitHub Actions

env:
  JAVA_VERSION: '21'
  WAR_NAME: demo.war

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Compilar y empaquetar el WAR
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compilar y empaquetar con Maven
        run: ./mvnw --no-transfer-progress clean package -DskipTests

      - name: Subir artefacto WAR
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: target/${{ env.WAR_NAME }}
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Desplegar en Azure App Service
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Descargar artefacto WAR
        uses: actions/download-artifact@v4
        with:
          name: war-artifact
          path: target/

      - name: Desplegar en Azure App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: portafolio-academico   # ← Mismo nombre que en pom.xml
          slot-name: production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: target/${{ env.WAR_NAME }}
